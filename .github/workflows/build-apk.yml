name: Build APK Android

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - build_apk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. RECUPERER LE PROJET
      # ==========================================================
      - name: Recuperer le projet
        uses: actions/checkout@v7

      # ==========================================================
      # 2. PREPARER L'IDENTITE DE L'APPLICATION
      # ==========================================================
      - name: Preparer l'identite de l'application
        id: app_info
        env:
          APP_NAME_INPUT: ${{ github.event.client_payload.app_name }}
        run: |
          set -e

          APP_NAME="${APP_NAME_INPUT:-SimiRork App}"

          APP_NAME=$(printf '%s' "$APP_NAME" \
            | tr '\r\n\t' ' ' \
            | sed 's/[[:space:]][[:space:]]*/ /g' \
            | sed 's/^ *//;s/ *$//')

          [ -n "$APP_NAME" ] || APP_NAME="SimiRork App"

          ASCII_NAME=$(printf '%s' "$APP_NAME" \
            | iconv -f UTF-8 -t ASCII//TRANSLIT 2>/dev/null \
            || printf '%s' "$APP_NAME")

          FILE_SLUG=$(printf '%s' "$ASCII_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9][^a-z0-9]*/-/g' \
            | sed 's/^-//;s/-$//')

          [ -n "$FILE_SLUG" ] || FILE_SLUG="simirork-app"

          APK_FILENAME="${FILE_SLUG}.apk"

          PACKAGE_SLUG=$(printf '%s' "$ASCII_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]//g')

          [ -n "$PACKAGE_SLUG" ] || PACKAGE_SLUG="app"

          FIRST_CHAR=$(printf '%s' "$PACKAGE_SLUG" | cut -c1)

          case "$FIRST_CHAR" in
            [a-z]) ;;
            *) PACKAGE_SLUG="app${PACKAGE_SLUG}" ;;
          esac

          PACKAGE_SLUG=$(printf '%s' "$PACKAGE_SLUG" | cut -c1-24)

          HASH_VALUE=$(printf '%s' "$APP_NAME" | sha256sum | cut -c1-8)
          HASH_SEGMENT="a${HASH_VALUE}"

          APPLICATION_ID="com.yoski.app.${PACKAGE_SLUG}.${HASH_SEGMENT}"

          echo "Nom application : $APP_NAME"
          echo "Application ID  : $APPLICATION_ID"
          echo "Nom fichier APK : $APK_FILENAME"

          {
            echo "app_name=$APP_NAME"
            echo "application_id=$APPLICATION_ID"
            echo "apk_filename=$APK_FILENAME"
          } >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 3. INJECTER LE HTML DU PROJET A COMPILER
      # ==========================================================
      - name: Injecter le HTML genere par SimiRork
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        run: |
          set -e

          [ -n "$HTML_BASE64" ] || {
            echo "ERREUR : aucun HTML recu."
            exit 1
          }

          mkdir -p public

          printf '%s' "$HTML_BASE64" \
            | base64 --decode \
            > public/index.html

          test -s public/index.html || {
            echo "ERREUR : public/index.html est vide."
            exit 1
          }

          echo "HTML injecte : $(wc -c < public/index.html) octets"

      # ==========================================================
      # 4. NODE.JS
      # ==========================================================
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # ==========================================================
      # 5. JAVA 21
      # ==========================================================
      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # ==========================================================
      # 6. ANDROID SDK
      # ==========================================================
      - name: Preparer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 7. DEPENDANCES NODE
      # ==========================================================
      - name: Installer les dependances Node
        run: npm ci

      # ==========================================================
      # 8. CONFIGURER CAPACITOR POUR L'APPLICATION COURANTE
      # ==========================================================
      - name: Configurer Capacitor pour l'application
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
        run: |
          set -e

          APP_NAME="$APP_NAME" APPLICATION_ID="$APPLICATION_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          app_name = os.environ["APP_NAME"]
          application_id = os.environ["APPLICATION_ID"]

          config = f'''import type {{ CapacitorConfig }} from '@capacitor/cli';

          const config: CapacitorConfig = {{
            appId: {json.dumps(application_id, ensure_ascii=False)},
            appName: {json.dumps(app_name, ensure_ascii=False)},
            webDir: 'public'
          }};

          export default config;
          '''

          Path("capacitor.config.ts").write_text(
              config,
              encoding="utf-8"
          )

          print(config)
          PY

      # ==========================================================
      # 9. SYNCHRONISER CAPACITOR
      # ==========================================================
      - name: Synchroniser Capacitor
        run: npx cap sync android

      # ==========================================================
      # 10. APPLIQUER L'IDENTITE ANDROID
      # ==========================================================
      - name: Appliquer l'identite Android
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
        run: |
          set -e

          # ------------------------------------------------------
          # applicationId
          # ------------------------------------------------------

          if [ -f "android/app/build.gradle" ]; then

            sed -i -E \
              "s/applicationId[[:space:]]+\"[^\"]+\"/applicationId \"$APPLICATION_ID\"/" \
              android/app/build.gradle

          elif [ -f "android/app/build.gradle.kts" ]; then

            sed -i -E \
              "s/applicationId[[:space:]]*=[[:space:]]*\"[^\"]+\"/applicationId = \"$APPLICATION_ID\"/" \
              android/app/build.gradle.kts

          else
            echo "ERREUR : fichier Gradle Android introuvable."
            exit 1
          fi

          # ------------------------------------------------------
          # strings.xml
          # ------------------------------------------------------

          APP_NAME="$APP_NAME" \
          APPLICATION_ID="$APPLICATION_ID" \
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if not path.exists():
              raise SystemExit(
                  "ERREUR : strings.xml introuvable."
              )

          tree = ET.parse(path)
          root = tree.getroot()

          values = {
              "app_name": os.environ["APP_NAME"],
              "title_activity_main": os.environ["APP_NAME"],
              "package_name": os.environ["APPLICATION_ID"],
              "custom_url_scheme": os.environ["APPLICATION_ID"],
          }

          for key, value in values.items():

              node = root.find(
                  f"./string[@name='{key}']"
              )

              if node is None:
                  node = ET.SubElement(
                      root,
                      "string",
                      {"name": key}
                  )

              node.text = value

          ET.indent(tree, space="    ")

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

          # ------------------------------------------------------
          # AndroidManifest.xml
          # ------------------------------------------------------

          MANIFEST_FILE=\
          "android/app/src/main/AndroidManifest.xml"

          [ -f "$MANIFEST_FILE" ] || {
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          }

          MANIFEST_FILE="$MANIFEST_FILE" python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(
              os.environ["MANIFEST_FILE"]
          )

          text = path.read_text(
              encoding="utf-8"
          )

          # Supprime le label de MainActivity afin que le nom
          # dynamique de l'application soit utilisé.

          text = re.sub(
              r'\s+android:label="@string/title_activity_main"',
              '',
              text
          )

          # Aucun ancien package fixe dans le manifeste.

          text = re.sub(
              r'\s+package="[^"]*"',
              '',
              text
          )

          path.write_text(
              text,
              encoding="utf-8"
          )
          PY

          # ------------------------------------------------------
          # Supprimer les anciennes icones qui pourraient prendre
          # le dessus sur celles generees pour l'application.
          # ------------------------------------------------------

          rm -f \
            android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

          rm -f \
            android/app/src/main/res/drawable/ic_launcher_foreground.xml

          rm -f \
            android/app/src/main/res/mipmap-*/ic_launcher_foreground.png

          echo "Identite Android appliquee."

      # ==========================================================
      # 11. GENERER L'ICONE SPECIFIQUE DE L'APPLICATION
      # ==========================================================
      - name: Generer l'icone specifique de l'application
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
        run: |
          set -e

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y \
              imagemagick \
              fonts-dejavu
          fi

          APP_NAME="$APP_NAME" python3 - <<'PY'
          import hashlib
          import os
          import re
          import unicodedata
          from pathlib import Path

          app_name = os.environ.get(
              "APP_NAME",
              "SimiRork App"
          ).strip()

          normalized = unicodedata.normalize(
              "NFKD",
              app_name
          )

          ascii_name = "".join(
              c for c in normalized
              if not unicodedata.combining(c)
          )

          letters = re.findall(
              r"[A-Za-z]",
              ascii_name.upper()
          )

          initials = "".join(
              letters[:2]
          ) or "SR"

          initials = initials[:2]

          palettes = [
              ("#2563EB", "#93C5FD"),
              ("#7C3AED", "#C4B5FD"),
              ("#059669", "#6EE7B7"),
              ("#DB2777", "#F9A8D4"),
              ("#EA580C", "#FDBA74"),
              ("#0891B2", "#67E8F9"),
              ("#4F46E5", "#A5B4FC"),
              ("#CA8A04", "#FDE68A"),
              ("#DC2626", "#FCA5A5"),
              ("#0F766E", "#99F6E4"),
          ]

          digest = hashlib.sha256(
              app_name.encode("utf-8")
          ).hexdigest()

          background, accent = palettes[
              int(digest[:8], 16)
              % len(palettes)
          ]

          res = Path(
              "android/app/src/main/res"
          )

          values_dir = res / "values"
          drawable_nodpi_dir = (
              res / "drawable-nodpi"
          )
          mipmap_anydpi = (
              res / "mipmap-anydpi-v26"
          )

          values_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          drawable_nodpi_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          mipmap_anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          # Couleur de fond de l'icone.

          (
              values_dir / "app_icon_colors.xml"
          ).write_text(
              f'''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_icon_background">
                  {background}
              </color>
          </resources>
          ''',
              encoding="utf-8"
          )

          # Icone adaptative.

          adaptive_xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background
                  android:drawable="@color/app_icon_background" />
              <foreground
                  android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          '''

          (
              mipmap_anydpi / "ic_launcher.xml"
          ).write_text(
              adaptive_xml,
              encoding="utf-8"
          )

          (
              mipmap_anydpi / "ic_launcher_round.xml"
          ).write_text(
              adaptive_xml,
              encoding="utf-8"
          )

          # Transmettre les valeurs au shell du meme step.

          with open(
              os.environ["GITHUB_ENV"],
              "a",
              encoding="utf-8"
          ) as env_file:

              env_file.write(
                  f"ICON_INITIALS={initials}\n"
              )

              env_file.write(
                  f"ICON_BACKGROUND={background}\n"
              )

              env_file.write(
                  f"ICON_ACCENT={accent}\n"
              )

          print("==========================================")
          print("ICONE APPLICATION")
          print("==========================================")
          print(f"Application : {app_name}")
          print(f"Initiales   : {initials}")
          print(f"Couleur     : {background}")
          print(f"Accent      : {accent}")
          print("==========================================")
          PY

          # ------------------------------------------------------
          # Foreground transparent pour les icones adaptatives.
          # ------------------------------------------------------

          convert \
            -size 1024x1024 \
            xc:none \
            -gravity center \
            -font DejaVu-Sans-Bold \
            -fill white \
            -pointsize 340 \
            -annotate +0+30 "$ICON_INITIALS" \
            -fill "$ICON_ACCENT" \
            -draw "roundrectangle 760,150 846,236 26,26" \
            android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          # ------------------------------------------------------
          # Icone complete pour les anciens Android.
          # ------------------------------------------------------

          convert \
            -size 1024x1024 \
            "xc:$ICON_BACKGROUND" \
            -gravity center \
            -font DejaVu-Sans-Bold \
            -fill white \
            -pointsize 340 \
            -annotate +0+30 "$ICON_INITIALS" \
            -fill "$ICON_ACCENT" \
            -draw "roundrectangle 760,150 846,236 26,26" \
            generated-app-icon.png

          declare -A ICON_SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in "${!ICON_SIZES[@]}"; do

            size="${ICON_SIZES[$density]}"

            out="android/app/src/main/res/mipmap-${density}"

            mkdir -p "$out"

            convert \
              generated-app-icon.png \
              -resize "${size}x${size}" \
              "$out/ic_launcher.png"

            convert \
              generated-app-icon.png \
              -resize "${size}x${size}" \
              "$out/ic_launcher_round.png"

          done

          echo "Icones generees pour : $APP_NAME"

      # ==========================================================
      # 12. VERIFIER LA CONFIGURATION FINALE
      # ==========================================================
      - name: Verifier la configuration finale
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURATION APK"
          echo "=========================================="
          echo "Nom            : $APP_NAME"
          echo "Application ID : $APPLICATION_ID"
          echo "=========================================="

          if [ -f "android/app/build.gradle" ]; then

            grep -n \
              "applicationId" \
              android/app/build.gradle

          else

            grep -n \
              "applicationId" \
              android/app/build.gradle.kts

          fi

          grep -n \
            'name="app_name"' \
            android/app/src/main/res/values/strings.xml

          grep -n \
            'android:label' \
            android/app/src/main/AndroidManifest.xml \
            || true

          test -s public/index.html

          test -s \
            android/app/src/main/res/drawable-nodpi/ic_launcher_foreground.png

          test -s \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png

          test -s \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png

          test -s \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png

          test -s \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png

          test -s \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          test ! -f \
            android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

          echo "Verification OK."

      # ==========================================================
      # 13. GRADLE
      # ==========================================================
      - name: Preparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre Gradle executable
        run: chmod +x android/gradlew

      # ==========================================================
      # 14. CONSTRUIRE L'APK
      # ==========================================================
      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      # ==========================================================
      # 15. PREPARER L'APK FINAL
      # ==========================================================
      - name: Preparer le fichier APK final
        env:
          APK_FILENAME: ${{ steps.app_info.outputs.apk_filename }}
        run: |
          set -e

          mkdir -p generated-apk

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "generated-apk/$APK_FILENAME"

          test -s \
            "generated-apk/$APK_FILENAME"

          echo "APK final :"
          ls -lh generated-apk/

      # ==========================================================
      # 16. PUBLIER L'APK
      # ==========================================================
      - name: Publier l'APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.app_info.outputs.apk_filename }}
          path: generated-apk/*.apk
          if-no-files-found: error