name: Build APK

on:
  repository_dispatch:
    types:
      - build_apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Installer les dependances npm
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INSTALLATION DES DEPENDANCES NPM"
          echo "=========================================="

          npm ci

      - name: Installer les outils Android
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: 'platform-tools'

      - name: Verifier les outils
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICATION DES OUTILS"
          echo "=========================================="

          echo "Java :"
          java -version

          echo ""
          echo "Node :"
          node --version

          echo ""
          echo "npm :"
          npm --version

          echo ""
          echo "ADB :"
          adb version

          echo ""
          echo "Capacitor :"
          npx cap --version

          echo ""
          echo "ANDROID_HOME :"
          echo "${ANDROID_HOME:-non defini}"

          echo "=========================================="

      - name: Synchroniser Capacitor Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SYNCHRONISATION CAPACITOR ANDROID"
          echo "=========================================="

          npx cap sync android

          echo ""
          echo "Verification du dossier Cordova Android..."

          if [ ! -f "android/capacitor-cordova-android-plugins/cordova.variables.gradle" ]; then
            echo "ERREUR : cordova.variables.gradle est toujours absent."
            echo ""
            echo "Contenu de android :"
            find android -maxdepth 3 -type f | sort | head -200
            exit 1
          fi

          echo "cordova.variables.gradle trouve."

      - name: Recuperer le HTML
        id: html
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RECUPERATION DU HTML"
          echo "=========================================="

          if [ -z "$HTML_BASE64" ]; then
            echo "ERREUR : client_payload.html_base64 est absent."
            exit 1
          fi

          printf '%s' "$HTML_BASE64" | base64 --decode > generated.html

          if [ ! -s generated.html ]; then
            echo "ERREUR : generated.html est vide."
            exit 1
          fi

          echo "HTML recupere avec succes."
          echo "Taille : $(wc -c < generated.html) octets"

      - name: Preparer l'identite de l'application
        id: identity
        env:
          APP_NAME_INPUT: ${{ github.event.client_payload.app_name }}
          PROJECT_ID_INPUT: ${{ github.event.client_payload.project_id }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PAYLOAD APK RECU PAR GITHUB"
          echo "=========================================="

          if [ -z "$APP_NAME_INPUT" ]; then
            echo "ERREUR : client_payload.app_name est ABSENT."
            exit 1
          fi

          if [ -z "$PROJECT_ID_INPUT" ]; then
            echo "ERREUR : client_payload.project_id est ABSENT."
            exit 1
          fi

          APP_NAME="$APP_NAME_INPUT"
          PROJECT_ID="$PROJECT_ID_INPUT"

          echo "Nom recu        : $APP_NAME"
          echo "Project ID recu : $PROJECT_ID"

          echo "=========================================="
          echo "GENERATION DE L'IDENTITE DETERMINISTE"
          echo "=========================================="

          HASH=$(printf '%s' "${PROJECT_ID}|${APP_NAME}" | sha256sum | cut -c1-16)

          SAFE_NAME=$(printf '%s' "$APP_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/_/g' \
            | sed 's/__*/_/g' \
            | sed 's/^_//' \
            | sed 's/_$//')

          if [ -z "$SAFE_NAME" ]; then
            SAFE_NAME="app"
          fi

          SAFE_NAME=$(printf '%s' "$SAFE_NAME" | cut -c1-20)

          # Chaque segment doit commencer par une lettre.
          # Cela garantit un applicationId Android valide meme si
          # le nom de l'application commence par un chiffre.
          if [[ "$SAFE_NAME" =~ ^[0-9] ]]; then
            SAFE_NAME="app_${SAFE_NAME}"
          fi

          # Le prefixe "h" garantit que le segment du hash commence
          # toujours par une lettre.
          APPLICATION_ID="com.yoski.app.${SAFE_NAME}.h${HASH:0:8}"

          # Verification stricte de l'applicationId Android.
          if [[ ! "$APPLICATION_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "ERREUR : Application ID Android invalide : $APPLICATION_ID"
            exit 1
          fi

          echo ""
          echo "Nom            : $APP_NAME"
          echo "Project ID     : $PROJECT_ID"
          echo "Hash           : $HASH"
          echo "Safe name      : $SAFE_NAME"
          echo "Application ID : $APPLICATION_ID"
          echo ""

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          echo "application_id=$APPLICATION_ID" >> "$GITHUB_OUTPUT"

      - name: Verifier le projet Android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICATION DU PROJET ANDROID"
          echo "=========================================="

          if [ ! -d "android" ]; then
            echo "ERREUR : dossier android absent."
            exit 1
          fi

          if [ ! -f "android/gradlew" ]; then
            echo "ERREUR : android/gradlew absent."
            exit 1
          fi

          chmod +x android/gradlew

          echo "Projet Android trouve."

      - name: Preparer le projet Android
        env:
          APPLICATION_ID: ${{ steps.identity.outputs.application_id }}
          APP_NAME: ${{ steps.identity.outputs.app_name }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "PREPARATION DU PROJET ANDROID"
          echo "=========================================="

          echo "Application ID : $APPLICATION_ID"
          echo "Nom application : $APP_NAME"

          python3 - <<'PY'
          import os
          from pathlib import Path
          import re

          application_id = os.environ["APPLICATION_ID"]
          app_name = os.environ["APP_NAME"]

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if manifest.exists():
              text = manifest.read_text(encoding="utf-8")

              text = text.replace(
                  'package="com.yoski.simirork"',
                  f'package="{application_id}"'
              )

              text = text.replace(
                  'android:label="SimiRork"',
                  'android:label="@string/app_name"'
              )

              manifest.write_text(text, encoding="utf-8")

          build_gradle = Path("android/app/build.gradle")

          if build_gradle.exists():
              text = build_gradle.read_text(encoding="utf-8")

              text = re.sub(
                  r'applicationId\s+"[^"]+"',
                  f'applicationId "{application_id}"',
                  text
              )

              build_gradle.write_text(text, encoding="utf-8")

          build_gradle_kts = Path("android/app/build.gradle.kts")

          if build_gradle_kts.exists():
              text = build_gradle_kts.read_text(encoding="utf-8")

              text = re.sub(
                  r'applicationId\s*=\s*"[^"]+"',
                  f'applicationId = "{application_id}"',
                  text
              )

              build_gradle_kts.write_text(text, encoding="utf-8")

          print("Configuration Android preparee.")
          PY

      - name: Configurer Capacitor pour l'APK local
        env:
          APPLICATION_ID: ${{ steps.identity.outputs.application_id }}
          APP_NAME: ${{ steps.identity.outputs.app_name }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURATION CAPACITOR APK LOCAL"
          echo "=========================================="

          CONFIG="android/app/src/main/assets/capacitor.config.json"

          if [ ! -f "$CONFIG" ]; then
            echo "ERREUR : capacitor.config.json absent."
            echo ""
            echo "Contenu des assets Android :"
            find android/app/src/main/assets -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("android/app/src/main/assets/capacitor.config.json")

          data = json.loads(
              path.read_text(encoding="utf-8")
          )

          server = data.get("server")

          if isinstance(server, dict):
              server.pop("url", None)

              if not server:
                  data.pop("server", None)

          data["appId"] = os.environ["APPLICATION_ID"]
          data["appName"] = os.environ["APP_NAME"]
          data["webDir"] = "public"

          path.write_text(
              json.dumps(data, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8"
          )

          print("Configuration Capacitor locale appliquee.")
          print("server.url : supprime")
          print("appId      :", data["appId"])
          print("appName    :", data["appName"])
          print("webDir     :", data["webDir"])
          PY

      - name: Injecter le HTML
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "INJECTION DU HTML"
          echo "=========================================="

          WEB_ASSETS="android/app/src/main/assets/public"

          mkdir -p "$WEB_ASSETS"

          cp generated.html "$WEB_ASSETS/index.html"

          if [ ! -s "$WEB_ASSETS/index.html" ]; then
            echo "ERREUR : index.html genere est vide."
            exit 1
          fi

          echo "HTML copie dans : $WEB_ASSETS/index.html"
          echo "Taille : $(wc -c < "$WEB_ASSETS/index.html") octets"

      - name: Generer l'icone unique
        env:
          APP_NAME: ${{ steps.identity.outputs.app_name }}
          HASH: ${{ steps.identity.outputs.hash }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "GENERATION DE L'ICONE"
          echo "=========================================="

          python3 - <<'PY'
          import hashlib
          import os
          import struct
          import zlib
          from pathlib import Path

          app_name = os.environ["APP_NAME"]
          hash_value = os.environ["HASH"]

          digest = hashlib.sha256(
              f"{app_name}|{hash_value}".encode("utf-8")
          ).digest()

          r = 40 + digest[0] % 180
          g = 40 + digest[1] % 180
          b = 40 + digest[2] % 180

          size = 192

          def chunk(chunk_type, data):
              return (
                  struct.pack(">I", len(data))
                  + chunk_type
                  + data
                  + struct.pack(
                      ">I",
                      zlib.crc32(chunk_type + data) & 0xffffffff
                  )
              )

          raw = bytearray()

          for y in range(size):
              raw.append(0)

              for x in range(size):
                  dx = x - size / 2
                  dy = y - size / 2
                  distance = (dx * dx + dy * dy) ** 0.5

                  if distance <= size * 0.43:
                      raw.extend([r, g, b, 255])
                  else:
                      raw.extend([0, 0, 0, 0])

          png = b"\x89PNG\r\n\x1a\n"

          png += chunk(
              b"IHDR",
              struct.pack(
                  ">IIBBBBB",
                  size,
                  size,
                  8,
                  6,
                  0,
                  0,
                  0
              )
          )

          png += chunk(
              b"IDAT",
              zlib.compress(bytes(raw), 9)
          )

          png += chunk(b"IEND", b"")

          base = Path("android/app/src/main/res")

          densities = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          for folder, target_size in densities.items():
              directory = base / folder
              directory.mkdir(parents=True, exist_ok=True)
              (directory / "ic_launcher.png").write_bytes(png)

          anydpi = base / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)

          (anydpi / "ic_launcher.xml").write_text(
              """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          """,
              encoding="utf-8"
          )

          drawable = base / "drawable"
          drawable.mkdir(parents=True, exist_ok=True)

          (drawable / "ic_launcher_foreground.png").write_bytes(png)

          values = base / "values"
          values.mkdir(parents=True, exist_ok=True)

          # Supprimer l'ancien fichier s'il existe afin d'eviter
          # un doublon avec la ressource generee dans colors.xml.
          legacy_background = values / "ic_launcher_background.xml"

          if legacy_background.exists():
              legacy_background.unlink()
              print(
                  "Ancien fichier ic_launcher_background.xml supprime "
                  "pour eviter un doublon."
              )

          values_file = values / "colors.xml"

          existing = ""
          if values_file.exists():
              existing = values_file.read_text(encoding="utf-8")

          if "ic_launcher_background" not in existing:
              content = existing.rstrip()

              if not content:
                  content = (
                      '<?xml version="1.0" encoding="utf-8"?>\n'
                      '<resources>\n'
                      '</resources>'
                  )

              content = content.replace(
                  "</resources>",
                  f'    <color name="ic_launcher_background">#{r:02X}{g:02X}{b:02X}</color>\n'
                  "</resources>"
              )

              values_file.write_text(content, encoding="utf-8")

          print(f"Icone generee pour : {app_name}")
          print(f"Couleur : #{r:02X}{g:02X}{b:02X}")
          PY

      - name: Configurer le nom de l'application
        env:
          APP_NAME: ${{ steps.identity.outputs.app_name }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURATION DU NOM"
          echo "=========================================="

          mkdir -p android/app/src/main/res/values

          cat > android/app/src/main/res/values/strings.xml <<EOF
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">${APP_NAME}</string>
          </resources>
          EOF

          echo "Nom Android configure : $APP_NAME"

      - name: Configurer le launcher
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURATION DU LAUNCHER"
          echo "=========================================="

          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST" ]; then
            echo "ERREUR : AndroidManifest.xml absent."
            exit 1
          fi

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text(encoding="utf-8")

          if 'android:icon=' in text:
              text = re.sub(
                  r'android:icon="[^"]+"',
                  'android:icon="@mipmap/ic_launcher"',
                  text
              )
          else:
              text = text.replace(
                  "<application",
                  '<application android:icon="@mipmap/ic_launcher"',
                  1
              )

          if 'android:roundIcon=' in text:
              text = re.sub(
                  r'android:roundIcon="[^"]+"',
                  'android:roundIcon="@mipmap/ic_launcher"',
                  text
              )
          else:
              text = text.replace(
                  '<application ',
                  '<application android:roundIcon="@mipmap/ic_launcher" ',
                  1
              )

          path.write_text(text, encoding="utf-8")
          PY

          echo "Launcher configure."

      - name: Verifier la configuration finale
        env:
          APPLICATION_ID: ${{ steps.identity.outputs.application_id }}
          APP_NAME: ${{ steps.identity.outputs.app_name }}
          PROJECT_ID: ${{ steps.identity.outputs.project_id }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURATION FINALE"
          echo "=========================================="

          echo "Nom            : $APP_NAME"
          echo "Project ID     : $PROJECT_ID"
          echo "Application ID : $APPLICATION_ID"

          echo ""
          echo "Manifest :"
          grep -n "manifest" android/app/src/main/AndroidManifest.xml || true
          grep -n "application" android/app/src/main/AndroidManifest.xml || true

          echo ""
          echo "Gradle :"
          grep -n "applicationId" android/app/build.gradle android/app/build.gradle.kts 2>/dev/null || true

          echo ""
          echo "Icones :"
          find android/app/src/main/res \
            \( -name "ic_launcher*" -o -name "*launcher*" \) \
            -type f \
            -print

          echo ""
          echo "Ressource couleur launcher :"
          grep -R -n "ic_launcher_background" android/app/src/main/res/values || true

          echo ""
          echo "Capacitor config :"
          cat android/app/src/main/assets/capacitor.config.json

          echo ""
          echo "HTML embarque :"
          ls -lh android/app/src/main/assets/public/index.html

          echo ""
          echo "Verification absence URL SimiRork :"
          if grep -n "https://simirork.vercel.app" \
            android/app/src/main/assets/capacitor.config.json; then
            echo "ERREUR : l'URL SimiRork est toujours presente dans la configuration APK."
            exit 1
          fi

          echo "URL SimiRork absente de la configuration APK."

          echo ""
          echo "Capacitor Cordova :"
          ls -lh android/capacitor-cordova-android-plugins/cordova.variables.gradle

          echo ""
          echo "=========================================="

      - name: Construire l'APK
        working-directory: android
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "CONSTRUCTION APK"
          echo "=========================================="

          chmod +x gradlew

          ./gradlew clean assembleDebug --no-daemon

      - name: Renommer l'APK
        env:
          SAFE_NAME: ${{ steps.identity.outputs.safe_name }}
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "RENOMMAGE APK"
          echo "=========================================="

          APK=$(find android/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK trouve."
            exit 1
          fi

          OUTPUT_DIR="android/app/build/outputs/apk/debug"
          FINAL_APK="$OUTPUT_DIR/${SAFE_NAME}.apk"

          cp "$APK" "$FINAL_APK"

          echo "APK source : $APK"
          echo "APK final  : $FINAL_APK"

      - name: Verifier l'APK
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICATION APK"
          echo "=========================================="

          APK=$(find android/app/build/outputs/apk/debug \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            | sort \
            | tail -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : APK introuvable."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERREUR : APK anormalement petit."
            exit 1
          fi

          echo "APK : $APK"
          echo "Taille : $SIZE octets"
          echo "APK valide."

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.identity.outputs.safe_name }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
