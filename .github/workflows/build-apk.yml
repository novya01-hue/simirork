name: Build APK Android

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - build_apk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Injecter le HTML généré par SimiRork
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        run: |
          printf '%s' "$HTML_BASE64" | base64 --decode > public/index.html

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Installer les dépendances Node
        run: npm ci

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre Gradle exécutable
        run: chmod +x android/gradlew

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v6
        with:
          name: simirork-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error