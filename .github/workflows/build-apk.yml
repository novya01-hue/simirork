name: Build APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build-apk:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      - name: Configurer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les outils Android
        uses: android-actions/setup-android@v3

      - name: Verifier les outils
        run: |
          java -version
          node --version
          npm --version
          adb version

      - name: Recuperer le HTML
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        run: |
          set -e

          echo "=========================================="
          echo "RECUPERATION DU HTML"
          echo "=========================================="

          if [ -z "$HTML_BASE64" ]; then
            echo "ERREUR : aucun HTML recu."
            exit 1
          fi

          printf '%s' "$HTML_BASE64" | base64 --decode > app.html

          if [ ! -s app.html ]; then
            echo "ERREUR : app.html est vide."
            exit 1
          fi

          echo "HTML recu avec succes."
          echo "Taille : $(wc -c < app.html) octets"

      - name: Preparer l'identite de l'application
        id: app_info
        env:
          APP_NAME_INPUT: ${{ github.event.client_payload.app_name }}
          PROJECT_ID_INPUT: ${{ github.event.client_payload.project_id }}
        run: |
          set -e

          echo "=========================================="
          echo "PAYLOAD APK RECU PAR GITHUB"
          echo "=========================================="

          if [ -z "$APP_NAME_INPUT" ]; then
            echo "ERREUR : client_payload.app_name est ABSENT."
            exit 1
          fi

          if [ -z "$PROJECT_ID_INPUT" ]; then
            echo "ERREUR : client_payload.project_id est ABSENT."
            exit 1
          fi

          APP_NAME="$APP_NAME_INPUT"
          PROJECT_ID="$PROJECT_ID_INPUT"

          APP_NAME=$(printf '%s' "$APP_NAME" \
            | tr '\r\n\t' ' ' \
            | sed 's/[[:space:]][[:space:]]*/ /g' \
            | sed 's/^ *//;s/ *$//')

          PROJECT_ID=$(printf '%s' "$PROJECT_ID" \
            | tr '\r\n\t' ' ' \
            | sed 's/[[:space:]][[:space:]]*/ /g' \
            | sed 's/^ *//;s/ *$//')

          if [ -z "$APP_NAME" ]; then
            echo "ERREUR : app_name est vide apres nettoyage."
            exit 1
          fi

          if [ -z "$PROJECT_ID" ]; then
            echo "ERREUR : project_id est vide apres nettoyage."
            exit 1
          fi

          echo "Nom reçu        : $APP_NAME"
          echo "Project ID reçu : $PROJECT_ID"
          echo "=========================================="

          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "project_id=$PROJECT_ID" >> "$GITHUB_OUTPUT"

      - name: Generer l'identite Android
        id: android_identity
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          PROJECT_ID: ${{ steps.app_info.outputs.project_id }}
        run: |
          set -e

          echo "=========================================="
          echo "GENERATION IDENTITE ANDROID"
          echo "=========================================="

          SAFE_NAME=$(printf '%s' "$APP_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]/ /g' \
            | awk '{$1=$1;print}' \
            | tr ' ' '_')

          [ -n "$SAFE_NAME" ] || SAFE_NAME="app"

          HASH=$(printf '%s' "${PROJECT_ID}|${APP_NAME}" \
            | sha256sum \
            | cut -c1-10)

          PACKAGE_SUFFIX=$(printf '%s' "$HASH" | tr '[:upper:]' '[:lower:]')

          APP_ID="com.yoski.app.${SAFE_NAME}.${PACKAGE_SUFFIX}"

          echo "Nom             : $APP_NAME"
          echo "Project ID      : $PROJECT_ID"
          echo "Identifiant APK : $APP_ID"

          echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
          echo "safe_name=$SAFE_NAME" >> "$GITHUB_OUTPUT"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Prepararer le projet Android
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APP_ID: ${{ steps.android_identity.outputs.app_id }}
        run: |
          set -e

          echo "=========================================="
          echo "PREPARATION PROJET ANDROID"
          echo "=========================================="

          if [ ! -d android ]; then
            echo "ERREUR : dossier android absent."
            exit 1
          fi

          sed -i "s/applicationId \".*\"/applicationId \"$APP_ID\"/" android/app/build.gradle

          if [ -f android/app/src/main/res/values/strings.xml ]; then
            sed -i "s#<string name=\"app_name\">.*</string>#<string name=\"app_name\">$APP_NAME</string>#" \
              android/app/src/main/res/values/strings.xml
          fi

          echo "Application ID configure."
          echo "Nom configure."

      - name: Injecter le HTML dans Android
        run: |
          set -e

          echo "=========================================="
          echo "INJECTION DU HTML"
          echo "=========================================="

          mkdir -p android/app/src/main/assets

          cp app.html android/app/src/main/assets/index.html

          echo "HTML copie dans les assets Android."

      - name: Generer une icone deterministe
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          PROJECT_ID: ${{ steps.app_info.outputs.project_id }}
        run: |
          set -e

          echo "=========================================="
          echo "GENERATION DE L'ICONE"
          echo "=========================================="

          python3 - <<'PY'
          import hashlib
          import os
          import struct
          import zlib

          app_name = os.environ.get("APP_NAME", "SimiRork App")
          project_id = os.environ.get("PROJECT_ID", "default")

          seed = hashlib.sha256(
              f"{project_id}|{app_name}".encode("utf-8")
          ).digest()

          size = 192

          r = 40 + seed[0] % 180
          g = 40 + seed[1] % 180
          b = 40 + seed[2] % 180

          def png_chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          raw = bytearray()

          for y in range(size):
              raw.append(0)

              for x in range(size):
                  dx = x - size / 2
                  dy = y - size / 2
                  distance = (dx * dx + dy * dy) ** 0.5

                  if distance <= size * 0.46:
                      rr, gg, bb = r, g, b
                  else:
                      rr, gg, bb = 20, 20, 25

                  raw.extend((rr, gg, bb, 255))

          png = bytearray(b"\x89PNG\r\n\x1a\n")
          png.extend(
              png_chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      size,
                      size,
                      8,
                      6,
                      0,
                      0,
                      0,
                  ),
              )
          )
          png.extend(png_chunk(b"IDAT", zlib.compress(bytes(raw), 9)))
          png.extend(png_chunk(b"IEND", b""))

          base = "android/app/src/main/res"

          for density in [
              "mipmap-mdpi",
              "mipmap-hdpi",
              "mipmap-xhdpi",
              "mipmap-xxhdpi",
              "mipmap-xxxhdpi",
          ]:
              directory = os.path.join(base, density)
              os.makedirs(directory, exist_ok=True)

              with open(os.path.join(directory, "ic_launcher.png"), "wb") as f:
                  f.write(png)

              with open(os.path.join(directory, "ic_launcher_round.png"), "wb") as f:
                  f.write(png)

          print("Icone generee de maniere deterministe.")
          print(f"Application : {app_name}")
          print(f"Project ID  : {project_id}")
          PY

      - name: Verifier la configuration finale
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          PROJECT_ID: ${{ steps.app_info.outputs.project_id }}
          APP_ID: ${{ steps.android_identity.outputs.app_id }}
        run: |
          set -e

          echo "=========================================="
          echo "CONFIGURATION APK"
          echo "=========================================="
          echo "Nom            : $APP_NAME"
          echo "Project ID     : $PROJECT_ID"
          echo "Application ID : $APP_ID"
          echo "=========================================="

          grep -n "applicationId" android/app/build.gradle
          grep -n "app_name" android/app/src/main/res/values/strings.xml || true

          test -f android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -f android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo "Configuration finale valide."

      - name: Construire l'APK
        working-directory: android
        run: |
          set -e

          echo "=========================================="
          echo "BUILD APK"
          echo "=========================================="

          chmod +x gradlew
          ./gradlew clean assembleDebug --no-daemon

          echo "Build termine."

      - name: Renommer l'APK
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          SAFE_NAME: ${{ steps.android_identity.outputs.safe_name }}
        run: |
          set -e

          echo "=========================================="
          echo "PREPARATION APK FINAL"
          echo "=========================================="

          mkdir -p final-apk

          SAFE_FILE_NAME=$(printf '%s' "$APP_NAME" \
            | sed 's/[^A-Za-z0-9._-]/_/g' \
            | sed 's/__*/_/g')

          [ -n "$SAFE_FILE_NAME" ] || SAFE_FILE_NAME="$SAFE_NAME"

          cp android/app/build/outputs/apk/debug/app-debug.apk \
            "final-apk/${SAFE_FILE_NAME}.apk"

          echo "APK final : final-apk/${SAFE_FILE_NAME}.apk"

      - name: Verifier l'APK final
        run: |
          set -e

          echo "=========================================="
          echo "VERIFICATION APK"
          echo "=========================================="

          ls -lh final-apk/

          APK=$(find final-apk -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERREUR : aucun APK final."
            exit 1
          fi

          SIZE=$(stat -c%s "$APK")

          if [ "$SIZE" -lt 100000 ]; then
            echo "ERREUR : APK anormalement petit."
            exit 1
          fi

          echo "APK valide : $APK"
          echo "Taille : $SIZE octets"

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.android_identity.outputs.safe_name }}
          path: final-apk/*.apk
          if-no-files-found: error