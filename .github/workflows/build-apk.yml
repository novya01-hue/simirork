name: Build APK Android

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - build_apk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Préparer l'identité de l'application
        id: app_info
        env:
          APP_NAME_INPUT: ${{ github.event.client_payload.app_name }}
        run: |
          export APP_NAME_INPUT

          python3 <<'PY'
          import os
          import re
          import hashlib
          import unicodedata

          app_name = os.environ.get(
              "APP_NAME_INPUT",
              "SimiRork App"
          ).strip()

          if not app_name:
              app_name = "SimiRork App"

          app_name = " ".join(app_name.split())

          # ------------------------------------------------------
          # Générer un slug pour le nom du fichier
          # ------------------------------------------------------
          normalized = unicodedata.normalize(
              "NFKD",
              app_name
          )

          normalized = normalized.encode(
              "ascii",
              "ignore"
          ).decode("ascii")

          normalized = normalized.lower()

          words = re.findall(
              r"[a-z0-9]+",
              normalized
          )

          file_slug = "-".join(words)

          if not file_slug:
              file_slug = "simirork-app"

          # ------------------------------------------------------
          # Slug pour applicationId
          # ------------------------------------------------------
          package_slug = "".join(words)

          if not package_slug:
              package_slug = "app"

          if not package_slug[0].isalpha():
              package_slug = "app" + package_slug

          package_slug = package_slug[:24]

          # ------------------------------------------------------
          # Empreinte pour éviter les collisions
          # ------------------------------------------------------
          hash_value = hashlib.sha256(
              app_name.encode("utf-8")
          ).hexdigest()[:8]

          application_id = (
              f"com.yoski.app.{package_slug}.{hash_value}"
          )

          apk_filename = f"{file_slug}.apk"

          echo "Nom application : $app_name"
          echo "Application ID  : $application_id"
          echo "Nom APK          : $apk_filename"

          {
            echo "app_name=$app_name"
            echo "application_id=$application_id"
            echo "file_slug=$file_slug"
            echo "apk_filename=$apk_filename"
          } >> "$GITHUB_OUTPUT"
          PY

      - name: Injecter le HTML généré par SimiRork
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        run: |
          printf '%s' "$HTML_BASE64" | base64 --decode > public/index.html

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Installer les dépendances Node
        run: npm ci

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer le nom et l'identifiant Android
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
        run: |
          python3 <<'PY'
          import os
          import re
          from pathlib import Path
          from xml.sax.saxutils import escape

          app_name = os.environ["APP_NAME"].strip()
          application_id = os.environ["APPLICATION_ID"].strip()

          # ======================================================
          # 1. applicationId
          # ======================================================

          gradle_files = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]

          gradle_file = None

          for candidate in gradle_files:
              if candidate.exists():
                  gradle_file = candidate
                  break

          if gradle_file is None:
              raise SystemExit(
                  "Impossible de trouver le fichier Gradle Android."
              )

          gradle_text = gradle_file.read_text(
              encoding="utf-8"
          )

          if gradle_file.name.endswith(".kts"):
              pattern = (
                  r'applicationId\s*=\s*["\'][^"\']+["\']'
              )

              replacement = (
                  f'applicationId = "{application_id}"'
              )
          else:
              pattern = (
                  r'applicationId\s+["\'][^"\']+["\']'
              )

              replacement = (
                  f'applicationId "{application_id}"'
              )

          new_gradle_text, count = re.subn(
              pattern,
              replacement,
              gradle_text,
              count=1,
          )

          if count == 0:
              raise SystemExit(
                  "applicationId introuvable dans le fichier Gradle."
              )

          gradle_file.write_text(
              new_gradle_text,
              encoding="utf-8"
          )

          # ======================================================
          # 2. Nom affiché Android
          # ======================================================

          strings_file = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          if not strings_file.exists():
              raise SystemExit(
                  "strings.xml introuvable."
              )

          strings_text = strings_file.read_text(
              encoding="utf-8"
          )

          escaped_name = escape(
              app_name,
              {'"': '&quot;'}
          )

          replacement_string = (
              f'<string name="app_name">'
              f'{escaped_name}'
              f'</string>'
          )

          app_name_pattern = (
              r'<string\s+name=["\']app_name["\']>'
              r'.*?'
              r'</string>'
          )

          new_strings_text, count = re.subn(
              app_name_pattern,
              replacement_string,
              strings_text,
              count=1,
              flags=re.DOTALL
          )

          if count == 0:
              if "</resources>" not in strings_text:
                  raise SystemExit(
                      "strings.xml ne contient pas </resources>."
                  )

              new_strings_text = strings_text.replace(
                  "</resources>",
                  f"    {replacement_string}\n"
                  "</resources>"
              )

          strings_file.write_text(
              new_strings_text,
              encoding="utf-8"
          )

          print(
              f"Nom Android : {app_name}"
          )

          print(
              f"Application ID : {application_id}"
          )
          PY

      - name: Vérifier la configuration finale
        run: |
          echo "=========================================="
          echo "Application : ${{ steps.app_info.outputs.app_name }}"
          echo "Application ID : ${{ steps.app_info.outputs.application_id }}"
          echo "Fichier APK : ${{ steps.app_info.outputs.apk_filename }}"
          echo "=========================================="

          grep -n "applicationId" android/app/build.gradle 2>/dev/null || true
          grep -n "applicationId" android/app/build.gradle.kts 2>/dev/null || true
          grep -n "app_name" android/app/src/main/res/values/strings.xml || true

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre Gradle exécutable
        run: chmod +x android/gradlew

      - name: Construire l'APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      - name: Préparer le fichier APK final
        env:
          APK_FILENAME: ${{ steps.app_info.outputs.apk_filename }}
        run: |
          mkdir -p generated-apk

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "generated-apk/$APK_FILENAME"

          ls -lh generated-apk

      - name: Publier l'APK
        uses: actions/upload-artifact@v6
        with:
          name: simirork-apk
          path: generated-apk/*.apk
          if-no-files-found: error