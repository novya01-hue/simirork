name: Build APK Android

run-name: APK ${{ github.event.client_payload.build_request_id }} - ${{ github.event.client_payload.app_name }}

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - build_apk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v7

      - name: Préparer l'identité de l'application
        id: app_info
        env:
          APP_NAME_INPUT: ${{ github.event.client_payload.app_name }}
        run: |
          APP_NAME="${APP_NAME_INPUT:-SimiRork App}"
          APP_NAME=$(printf '%s' "$APP_NAME" | tr '\r\n\t' ' ' | sed 's/[[:space:]][[:space:]]*/ /g' | sed 's/^ *//;s/ *$//')
          [ -n "$APP_NAME" ] || APP_NAME="SimiRork App"

          ASCII_NAME=$(printf '%s' "$APP_NAME" | iconv -f UTF-8 -t ASCII//TRANSLIT 2>/dev/null || printf '%s' "$APP_NAME")

          FILE_SLUG=$(printf '%s' "$ASCII_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9][^a-z0-9]*/-/g' | sed 's/^-//;s/-$//')
          [ -n "$FILE_SLUG" ] || FILE_SLUG="simirork-app"
          APK_FILENAME="${FILE_SLUG}.apk"

          PACKAGE_SLUG=$(printf '%s' "$ASCII_NAME" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]//g')
          [ -n "$PACKAGE_SLUG" ] || PACKAGE_SLUG="app"

          FIRST_CHAR=$(printf '%s' "$PACKAGE_SLUG" | cut -c1)

          case "$FIRST_CHAR" in
            [a-z]) ;;
            *) PACKAGE_SLUG="app${PACKAGE_SLUG}" ;;
          esac

          PACKAGE_SLUG=$(printf '%s' "$PACKAGE_SLUG" | cut -c1-24)

          HASH_VALUE=$(printf '%s' "$APP_NAME" | sha256sum | cut -c1-8)
          APPLICATION_ID="com.yoski.app.${PACKAGE_SLUG}.a${HASH_VALUE}"

          echo "Nom application : $APP_NAME"
          echo "Application ID  : $APPLICATION_ID"
          echo "Nom fichier APK : $APK_FILENAME"

          {
            echo "app_name=$APP_NAME"
            echo "application_id=$APPLICATION_ID"
            echo "apk_filename=$APK_FILENAME"
          } >> "$GITHUB_OUTPUT"

      - name: Injecter le HTML généré
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        run: |
          set -e

          [ -n "$HTML_BASE64" ] || {
            echo "ERREUR : aucun HTML reçu."
            exit 1
          }

          mkdir -p public

          printf '%s' "$HTML_BASE64" |
            base64 --decode > public/index.html

          test -s public/index.html || {
            echo "ERREUR : public/index.html est vide."
            exit 1
          }

          echo "HTML injecté : $(wc -c < public/index.html) octets"

      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Préparer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Installer les dépendances Node
        run: npm ci

      - name: Configurer Capacitor pour l'application
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
        run: |
          APP_NAME="$APP_NAME" APPLICATION_ID="$APPLICATION_ID" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          app_name = os.environ["APP_NAME"]
          application_id = os.environ["APPLICATION_ID"]

          config = f"""import type {{ CapacitorConfig }} from '@capacitor/cli';

          const config: CapacitorConfig = {{
            appId: {json.dumps(application_id, ensure_ascii=False)},
            appName: {json.dumps(app_name, ensure_ascii=False)},
            webDir: 'public'
          }};

          export default config;
          """

          Path("capacitor.config.ts").write_text(
              config,
              encoding="utf-8"
          )

          print(config)
          PY

      - name: Synchroniser Capacitor
        run: npx cap sync android

      - name: Configurer l'identité Android
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
        run: |
          set -e

          GRADLE_FILE="android/app/build.gradle"

          test -f "$GRADLE_FILE" || {
            echo "ERREUR : $GRADLE_FILE introuvable."
            exit 1
          }

          sed -i -E \
            "s/applicationId[[:space:]]+\"[^\"]+\"/applicationId \"$APPLICATION_ID\"/" \
            "$GRADLE_FILE"

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          APP_NAME="$APP_NAME" APPLICATION_ID="$APPLICATION_ID" python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          path = Path(
              "android/app/src/main/res/values/strings.xml"
          )

          tree = ET.parse(path)
          root = tree.getroot()

          values = {
              "app_name": os.environ["APP_NAME"],
              "title_activity_main": os.environ["APP_NAME"],
              "package_name": os.environ["APPLICATION_ID"],
              "custom_url_scheme": os.environ["APPLICATION_ID"],
          }

          for key, value in values.items():
              node = root.find(
                  f"./string[@name='{key}']"
              )

              if node is None:
                  node = ET.SubElement(
                      root,
                      "string",
                      {"name": key}
                  )

              node.text = value

          ET.indent(
              tree,
              space="    "
          )

          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )
          PY

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          test -f "$MANIFEST_FILE" || {
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          }

          sed -i \
            's/[[:space:]]android:label="@string\/title_activity_main"//' \
            "$MANIFEST_FILE"

          echo "Application ID : $APPLICATION_ID"
          echo "Nom Android    : $APP_NAME"

      - name: Préparer ImageMagick
        run: |
          set -e

          if ! command -v convert >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y imagemagick
          fi

          convert -version

      - name: Générer l'icône Android
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          LOGO_BASE64: ${{ github.event.client_payload.logo_base64 }}
        run: |
          set -euo pipefail

          RES="android/app/src/main/res"

          mkdir -p "$RES/drawable-nodpi"

          rm -f "$RES/mipmap-anydpi-v26/ic_launcher.xml"
          rm -f "$RES/mipmap-anydpi-v26/ic_launcher_round.xml"
          rm -f "$RES/drawable-v24/ic_launcher_foreground.xml"
          rm -f "$RES/drawable-nodpi/ic_launcher_foreground.png"

          ICON_SOURCE=""

          if [ -n "${LOGO_BASE64:-}" ] && [ "${LOGO_BASE64:-}" != "null" ]; then
            echo "Logo sélectionné reçu depuis SimiRork."

            printf '%s' "$LOGO_BASE64" |
              base64 --decode > selected-logo.bin

            test -s selected-logo.bin || {
              echo "ERREUR : logo décodé vide."
              exit 1
            }

            identify selected-logo.bin >/dev/null 2>&1 || {
              echo "ERREUR : le logo reçu n'est pas une image valide."
              exit 1
            }

            convert selected-logo.bin \
              -auto-orient \
              -resize '512x512^' \
              -gravity center \
              -extent 512x512 \
              -strip \
              PNG32:generated-app-icon.png

            ICON_SOURCE="generated-app-icon.png"

            echo "Icône personnalisée préparée depuis le logo sélectionné."

          else
            echo "Aucun logo sélectionné reçu."
            echo "Génération de l'icône de secours."

            APP_NAME="$APP_NAME" python3 - <<'PY'
          import hashlib
          import html
          import os
          import re
          import unicodedata
          from pathlib import Path

          app_name = os.environ.get(
              "APP_NAME",
              "SimiRork App"
          ).strip()

          normalized = unicodedata.normalize(
              "NFKD",
              app_name
          )

          ascii_name = "".join(
              c
              for c in normalized
              if not unicodedata.combining(c)
          )

          letters = re.findall(
              r"[A-Za-z]",
              ascii_name.upper()
          )

          initials = "".join(
              letters[:2]
          ) or "SR"

          initials = initials[:2]

          palettes = [
              ("#2563EB", "#93C5FD"),
              ("#7C3AED", "#C4B5FD"),
              ("#059669", "#6EE7B7"),
              ("#DB2777", "#F9A8D4"),
              ("#EA580C", "#FDBA74"),
              ("#0891B2", "#67E8F9"),
              ("#4F46E5", "#A5B4FC"),
              ("#CA8A04", "#FDE68A"),
              ("#DC2626", "#FCA5A5"),
              ("#0F766E", "#99F6E4"),
          ]

          digest = hashlib.sha256(
              app_name.encode("utf-8")
          ).hexdigest()

          background, accent = palettes[
              int(digest[:8], 16)
              % len(palettes)
          ]

          safe_initials = html.escape(
              initials
          )

          svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
            <rect width="1024" height="1024" rx="190" fill="{background}"/>
            <circle cx="512" cy="512" r="330" fill="#FFFFFF" opacity="0.08"/>
            <rect x="760" y="150" width="86" height="86" rx="26" fill="{accent}"/>
            <text x="512" y="625" text-anchor="middle" font-family="DejaVu Sans" font-size="340" font-weight="700" fill="#FFFFFF">{safe_initials}</text>
          </svg>'''

          Path(
              "generated-app-icon.svg"
          ).write_text(
              svg,
              encoding="utf-8"
          )

          print(
              f"Icône de secours : {initials}"
          )
          PY

            convert generated-app-icon.svg \
              -resize 512x512 \
              -strip \
              PNG32:generated-app-icon.png

            ICON_SOURCE="generated-app-icon.png"
          fi

          test -s "$ICON_SOURCE" || {
            echo "ERREUR : source d'icône absente."
            exit 1
          }

          declare -A ICON_SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in "${!ICON_SIZES[@]}"; do
            size="${ICON_SIZES[$density]}"
            out="$RES/mipmap-${density}"

            mkdir -p "$out"

            convert "$ICON_SOURCE" \
              -resize "${size}x${size}" \
              -strip \
              "$out/ic_launcher.png"

            convert "$ICON_SOURCE" \
              -resize "${size}x${size}" \
              -strip \
              "$out/ic_launcher_round.png"
          done

          echo "=========================================="
          echo "ICÔNES ANDROID GÉNÉRÉES"
          echo "=========================================="

          for density in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            ls -lh "$RES/mipmap-${density}/ic_launcher.png"
          done

      - name: Vérifier la configuration finale
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
          LOGO_BASE64: ${{ github.event.client_payload.logo_base64 }}
        run: |
          set -e

          echo "=========================================="
          echo "IDENTITÉ APK"
          echo "=========================================="
          echo "Nom            : $APP_NAME"
          echo "Application ID : $APPLICATION_ID"

          if [ -n "${LOGO_BASE64:-}" ] && [ "${LOGO_BASE64:-}" != "null" ]; then
            echo "Icône           : logo sélectionné SimiRork"
          else
            echo "Icône           : icône automatique de secours"
          fi

          echo "=========================================="

          grep -n \
            "applicationId" \
            android/app/build.gradle

          grep -n \
            'name="app_name"' \
            android/app/src/main/res/values/strings.xml

          grep -n \
            'android:label' \
            android/app/src/main/AndroidManifest.xml || true

          test -s public/index.html

          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          test -s android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          test ! -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          test ! -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          test ! -f android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml

          echo "Vérification OK."

      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre Gradle exécutable
        run: chmod +x android/gradlew

      - name: Construire l'APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Préparer le fichier APK final
        env:
          APK_FILENAME: ${{ steps.app_info.outputs.apk_filename }}
        run: |
          set -e

          mkdir -p generated-apk

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "generated-apk/$APK_FILENAME"

          ls -lh generated-apk/

      - name: Publier l'APK
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.app_info.outputs.apk_filename }}
          path: generated-apk/*.apk
          if-no-files-found: error