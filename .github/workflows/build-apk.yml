name: Build APK Android

on:
  workflow_dispatch:

  repository_dispatch:
    types:
      - build_apk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ==========================================================
      # 1. RÉCUPÉRER LE PROJET
      # ==========================================================
      - name: Récupérer le projet
        uses: actions/checkout@v7

      # ==========================================================
      # 2. PRÉPARER LE NOM ET L'IDENTITÉ DE L'APPLICATION
      # ==========================================================
      - name: Préparer l'identité de l'application
        id: app_info
        env:
          APP_NAME_INPUT: ${{ github.event.client_payload.app_name }}
        run: |
          APP_NAME="${APP_NAME_INPUT:-SimiRork App}"

          APP_NAME=$(printf '%s' "$APP_NAME" \
            | tr '\r\n\t' ' ' \
            | sed 's/[[:space:]][[:space:]]*/ /g' \
            | sed 's/^ *//;s/ *$//')

          if [ -z "$APP_NAME" ]; then
            APP_NAME="SimiRork App"
          fi

          # ------------------------------------------------------
          # Nom du fichier APK
          # ------------------------------------------------------

          ASCII_NAME=$(printf '%s' "$APP_NAME" \
            | iconv -f UTF-8 -t ASCII//TRANSLIT 2>/dev/null \
            || printf '%s' "$APP_NAME")

          FILE_SLUG=$(printf '%s' "$ASCII_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9][^a-z0-9]*/-/g' \
            | sed 's/^-//;s/-$//')

          if [ -z "$FILE_SLUG" ]; then
            FILE_SLUG="simirork-app"
          fi

          APK_FILENAME="${FILE_SLUG}.apk"

          # ------------------------------------------------------
          # Application ID Android
          # ------------------------------------------------------

          PACKAGE_SLUG=$(printf '%s' "$ASCII_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-z0-9]//g')

          if [ -z "$PACKAGE_SLUG" ]; then
            PACKAGE_SLUG="app"
          fi

          FIRST_CHAR=$(printf '%s' "$PACKAGE_SLUG" | cut -c1)

          case "$FIRST_CHAR" in
            [a-z])
              ;;
            *)
              PACKAGE_SLUG="app${PACKAGE_SLUG}"
              ;;
          esac

          PACKAGE_SLUG=$(printf '%s' "$PACKAGE_SLUG" | cut -c1-24)

          # Segment de hash toujours commençant par une lettre.
          HASH_VALUE=$(printf '%s' "$APP_NAME" \
            | sha256sum \
            | cut -c1-8)

          HASH_SEGMENT="a${HASH_VALUE}"

          APPLICATION_ID="com.yoski.app.${PACKAGE_SLUG}.${HASH_SEGMENT}"

          echo "Nom application : $APP_NAME"
          echo "Application ID  : $APPLICATION_ID"
          echo "Nom fichier APK : $APK_FILENAME"

          {
            echo "app_name=$APP_NAME"
            echo "application_id=$APPLICATION_ID"
            echo "apk_filename=$APK_FILENAME"
          } >> "$GITHUB_OUTPUT"

      # ==========================================================
      # 3. INJECTER LE HTML GÉNÉRÉ
      # ==========================================================
      - name: Injecter le HTML généré par SimiRork
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          HTML_BASE64: ${{ github.event.client_payload.html_base64 }}
        run: |
          printf '%s' "$HTML_BASE64" | base64 --decode > public/index.html

      # ==========================================================
      # 4. INSTALLER NODE.JS
      # ==========================================================
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      # ==========================================================
      # 5. INSTALLER JAVA 21
      # ==========================================================
      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      # ==========================================================
      # 6. PRÉPARER ANDROID SDK
      # ==========================================================
      - name: Préparer Android SDK
        uses: android-actions/setup-android@v4

      - name: Installer les composants Android
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================================
      # 7. INSTALLER LES DÉPENDANCES NODE
      # ==========================================================
      - name: Installer les dépendances Node
        run: npm ci

      # ==========================================================
      # 8. SYNCHRONISER CAPACITOR
      # ==========================================================
      - name: Synchroniser Capacitor
        run: npx cap sync android

      # ==========================================================
      # 9. GÉNÉRER L'ICÔNE SPÉCIFIQUE DE L'APPLICATION
      # ==========================================================
      - name: Générer l'icône spécifique de l'application
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import re
          import unicodedata
          from pathlib import Path

          app_name = os.environ.get("APP_NAME", "SimiRork App").strip()

          normalized = unicodedata.normalize("NFKD", app_name)
          ascii_name = "".join(
              char for char in normalized
              if not unicodedata.combining(char)
          )

          ascii_name = re.sub(
              r"[^A-Za-z0-9 ]+",
              " ",
              ascii_name
          )

          words = [
              word.upper()
              for word in ascii_name.split()
              if word
          ]

          letters = re.findall(
              r"[A-Z]",
              ascii_name.upper()
          )

          if len(words) >= 2:
              initials = words[0][0] + words[1][0]
          elif len(letters) >= 2:
              initials = letters[0] + letters[1]
          elif len(letters) == 1:
              initials = letters[0] + "A"
          else:
              initials = "SR"

          initials = initials[:2]

          palettes = [
              ("#2563EB", "#93C5FD"),
              ("#7C3AED", "#C4B5FD"),
              ("#059669", "#6EE7B7"),
              ("#DB2777", "#F9A8D4"),
              ("#EA580C", "#FDBA74"),
              ("#0891B2", "#67E8F9"),
              ("#4F46E5", "#A5B4FC"),
              ("#CA8A04", "#FDE68A"),
              ("#DC2626", "#FCA5A5"),
              ("#0F766E", "#99F6E4"),
          ]

          digest = hashlib.sha256(
              app_name.encode("utf-8")
          ).hexdigest()

          palette_index = (
              int(digest[:8], 16)
              % len(palettes)
          )

          background = palettes[palette_index][0]
          accent = palettes[palette_index][1]

          glyphs = {
              "A": [
                  "01110",
                  "10001",
                  "10001",
                  "11111",
                  "10001",
                  "10001",
                  "10001",
              ],
              "B": [
                  "11110",
                  "10001",
                  "10001",
                  "11110",
                  "10001",
                  "10001",
                  "11110",
              ],
              "C": [
                  "01111",
                  "10000",
                  "10000",
                  "10000",
                  "10000",
                  "10000",
                  "01111",
              ],
              "D": [
                  "11110",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "11110",
              ],
              "E": [
                  "11111",
                  "10000",
                  "10000",
                  "11110",
                  "10000",
                  "10000",
                  "11111",
              ],
              "F": [
                  "11111",
                  "10000",
                  "10000",
                  "11110",
                  "10000",
                  "10000",
                  "10000",
              ],
              "G": [
                  "01111",
                  "10000",
                  "10000",
                  "10111",
                  "10001",
                  "10001",
                  "01111",
              ],
              "H": [
                  "10001",
                  "10001",
                  "10001",
                  "11111",
                  "10001",
                  "10001",
                  "10001",
              ],
              "I": [
                  "11111",
                  "00100",
                  "00100",
                  "00100",
                  "00100",
                  "00100",
                  "11111",
              ],
              "J": [
                  "00111",
                  "00010",
                  "00010",
                  "00010",
                  "00010",
                  "10010",
                  "01100",
              ],
              "K": [
                  "10001",
                  "10010",
                  "10100",
                  "11000",
                  "10100",
                  "10010",
                  "10001",
              ],
              "L": [
                  "10000",
                  "10000",
                  "10000",
                  "10000",
                  "10000",
                  "10000",
                  "11111",
              ],
              "M": [
                  "10001",
                  "11011",
                  "10101",
                  "10101",
                  "10001",
                  "10001",
                  "10001",
              ],
              "N": [
                  "10001",
                  "11001",
                  "10101",
                  "10011",
                  "10001",
                  "10001",
                  "10001",
              ],
              "O": [
                  "01110",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "01110",
              ],
              "P": [
                  "11110",
                  "10001",
                  "10001",
                  "11110",
                  "10000",
                  "10000",
                  "10000",
              ],
              "Q": [
                  "01110",
                  "10001",
                  "10001",
                  "10001",
                  "10101",
                  "10010",
                  "01101",
              ],
              "R": [
                  "11110",
                  "10001",
                  "10001",
                  "11110",
                  "10100",
                  "10010",
                  "10001",
              ],
              "S": [
                  "01111",
                  "10000",
                  "10000",
                  "01110",
                  "00001",
                  "00001",
                  "11110",
              ],
              "T": [
                  "11111",
                  "00100",
                  "00100",
                  "00100",
                  "00100",
                  "00100",
                  "00100",
              ],
              "U": [
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "01110",
              ],
              "V": [
                  "10001",
                  "10001",
                  "10001",
                  "10001",
                  "01010",
                  "01010",
                  "00100",
              ],
              "W": [
                  "10001",
                  "10001",
                  "10001",
                  "10101",
                  "10101",
                  "11011",
                  "10001",
              ],
              "X": [
                  "10001",
                  "01010",
                  "00100",
                  "00100",
                  "00100",
                  "01010",
                  "10001",
              ],
              "Y": [
                  "10001",
                  "01010",
                  "00100",
                  "00100",
                  "00100",
                  "00100",
                  "00100",
              ],
              "Z": [
                  "11111",
                  "00001",
                  "00010",
                  "00100",
                  "01000",
                  "10000",
                  "11111",
              ],
          }

          res = Path(
              "android/app/src/main/res"
          )

          drawable_dir = res / "drawable"
          mipmap_anydpi = (
              res / "mipmap-anydpi-v26"
          )
          values_dir = res / "values"

          drawable_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          mipmap_anydpi.mkdir(
              parents=True,
              exist_ok=True
          )

          values_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          # ------------------------------------------------------
          # Générer les rectangles des lettres pour SVG
          # ------------------------------------------------------

          def svg_letter_rects(
              text,
              x,
              y,
              scale,
              fill
          ):
              output = []

              gap = scale

              for index, char in enumerate(text):
                  pattern = glyphs.get(char)

                  if not pattern:
                      continue

                  offset_x = x + index * (
                      5 * scale + gap
                  )

                  for row, line in enumerate(pattern):
                      for col, cell in enumerate(line):
                          if cell != "1":
                              continue

                          px = (
                              offset_x
                              + col * scale
                          )
                          py = (
                              y
                              + row * scale
                          )

                          output.append(
                              f'<rect x="{px:g}" '
                              f'y="{py:g}" '
                              f'width="{scale:g}" '
                              f'height="{scale:g}" '
                              f'rx="{scale * 0.16:g}" '
                              f'fill="{fill}"/>'
                          )

              return "\n".join(output)

          # ------------------------------------------------------
          # SVG complet carré
          # ------------------------------------------------------

          full_letters = svg_letter_rects(
              initials,
              370,
              370,
              42,
              "#FFFFFF"
          )

          full_svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
          width="1024"
          height="1024"
          viewBox="0 0 1024 1024">
          <rect width="1024"
                height="1024"
                rx="190"
                fill="{background}"/>
          <circle cx="512"
                  cy="512"
                  r="330"
                  fill="#FFFFFF"
                  opacity="0.08"/>
          <rect x="760"
                y="150"
                width="86"
                height="86"
                rx="26"
                fill="{accent}"/>
          {full_letters}
          </svg>"""

          # ------------------------------------------------------
          # SVG rond pour ic_launcher_round
          # ------------------------------------------------------

          round_svg = f"""<svg xmlns="http://www.w3.org/2000/svg"
          width="1024"
          height="1024"
          viewBox="0 0 1024 1024">
          <circle cx="512"
                  cy="512"
                  r="512"
                  fill="{background}"/>
          <circle cx="512"
                  cy="512"
                  r="330"
                  fill="#FFFFFF"
                  opacity="0.08"/>
          <circle cx="800"
                  cy="190"
                  r="42"
                  fill="{accent}"/>
          {full_letters}
          </svg>"""

          Path(
              "generated-app-icon.svg"
          ).write_text(
              full_svg,
              encoding="utf-8"
          )

          Path(
              "generated-app-icon-round.svg"
          ).write_text(
              round_svg,
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Couleur de fond Android
          # ------------------------------------------------------

          colors_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_icon_background">{background}</color>
          </resources>
          """

          (values_dir / "app_icon_colors.xml").write_text(
              colors_xml,
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Background adaptatif
          # ------------------------------------------------------

          background_xml = """<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

              <path
                  android:fillColor="@color/app_icon_background"
                  android:pathData="M0,0H108V108H0Z" />
          </vector>
          """

          (
              drawable_dir /
              "ic_launcher_background.xml"
          ).write_text(
              background_xml,
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Fonction pathData pour les lettres
          # ------------------------------------------------------

          def vector_letter_paths(
              text,
              x,
              y,
              scale,
              fill
          ):
              paths = []

              gap = scale

              for index, char in enumerate(text):
                  pattern = glyphs.get(char)

                  if not pattern:
                      continue

                  offset_x = x + index * (
                      5 * scale + gap
                  )

                  for row, line in enumerate(pattern):
                      for col, cell in enumerate(line):
                          if cell != "1":
                              continue

                          left = (
                              offset_x
                              + col * scale
                          )
                          top = (
                              y
                              + row * scale
                          )
                          right = left + scale
                          bottom = top + scale

                          path = (
                              f"M{left:g},{top:g}"
                              f"H{right:g}"
                              f"V{bottom:g}"
                              f"H{left:g}Z"
                          )

                          paths.append(
                              f"""    <path
                  android:fillColor="{fill}"
                  android:pathData="{path}" />"""
                          )

              return "\n".join(paths)

          # ------------------------------------------------------
          # Foreground adaptatif
          # ------------------------------------------------------

          vector_letters = vector_letter_paths(
              initials,
              25,
              35,
              5.2,
              "#FFFFFFFF"
          )

          accent_path = """
              <path
                  android:fillColor="%s"
                  android:pathData="M78,22 H86 V30 H78 Z" />
          """ % accent

          foreground_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

          {accent_path}

          {vector_letters}

          </vector>
          """

          (
              drawable_dir /
              "ic_launcher_foreground.xml"
          ).write_text(
              foreground_xml,
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Monochrome
          # ------------------------------------------------------

          monochrome_letters = vector_letter_paths(
              initials,
              25,
              35,
              5.2,
              "#FFFFFFFF"
          )

          monochrome_xml = f"""<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">

          {monochrome_letters}

          </vector>
          """

          (
              drawable_dir /
              "ic_launcher_monochrome.xml"
          ).write_text(
              monochrome_xml,
              encoding="utf-8"
          )

          # ------------------------------------------------------
          # Icônes adaptatives
          # ------------------------------------------------------

          adaptive_xml = """<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
              <monochrome android:drawable="@drawable/ic_launcher_monochrome" />
          </adaptive-icon>
          """

          (
              mipmap_anydpi /
              "ic_launcher.xml"
          ).write_text(
              adaptive_xml,
              encoding="utf-8"
          )

          (
              mipmap_anydpi /
              "ic_launcher_round.xml"
          ).write_text(
              adaptive_xml,
              encoding="utf-8"
          )

          print("==========================================")
          print("ICÔNE APPLICATION")
          print("==========================================")
          print(f"Application : {app_name}")
          print(f"Initiales   : {initials}")
          print(f"Couleur     : {background}")
          print(f"Accent      : {accent}")
          print("==========================================")
          PY

          # ------------------------------------------------------
          # PNG LEGACY POUR LES ANCIENS ANDROID
          # ------------------------------------------------------

          if command -v magick >/dev/null 2>&1; then
            ICON_TOOL="magick"
          elif command -v convert >/dev/null 2>&1; then
            ICON_TOOL="convert"
          else
            echo "ImageMagick absent : installation..."
            sudo apt-get update
            sudo apt-get install -y imagemagick

            if command -v magick >/dev/null 2>&1; then
              ICON_TOOL="magick"
            else
              ICON_TOOL="convert"
            fi
          fi

          declare -A ICON_SIZES=(
            [mdpi]=48
            [hdpi]=72
            [xhdpi]=96
            [xxhdpi]=144
            [xxxhdpi]=192
          )

          for density in "${!ICON_SIZES[@]}"; do
            size="${ICON_SIZES[$density]}"

            mkdir -p \
              "android/app/src/main/res/mipmap-${density}"

            "$ICON_TOOL" \
              generated-app-icon.svg \
              -resize "${size}x${size}" \
              "android/app/src/main/res/mipmap-${density}/ic_launcher.png"

            "$ICON_TOOL" \
              generated-app-icon-round.svg \
              -resize "${size}x${size}" \
              "android/app/src/main/res/mipmap-${density}/ic_launcher_round.png"
          done

          echo "Icônes PNG générées."

      # ==========================================================
      # 10. CONFIGURER L'IDENTITÉ ANDROID
      # ==========================================================
      - name: Configurer l'identité Android
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
        run: |
          GRADLE_FILE=""

          if [ -f "android/app/build.gradle" ]; then
            GRADLE_FILE="android/app/build.gradle"
          elif [ -f "android/app/build.gradle.kts" ]; then
            GRADLE_FILE="android/app/build.gradle.kts"
          else
            echo "ERREUR : fichier Gradle Android introuvable."
            exit 1
          fi

          echo "Fichier Gradle : $GRADLE_FILE"

          # ------------------------------------------------------
          # applicationId
          # ------------------------------------------------------

          if [[ "$GRADLE_FILE" == *.kts ]]; then

            sed -i -E \
              "s/applicationId[[:space:]]*=[[:space:]]*\"[^\"]+\"/applicationId = \"$APPLICATION_ID\"/" \
              "$GRADLE_FILE"

          else

            sed -i -E \
              "s/applicationId[[:space:]]+\"[^\"]+\"/applicationId \"$APPLICATION_ID\"/" \
              "$GRADLE_FILE"

          fi

          echo "Application ID configuré : $APPLICATION_ID"

          # ------------------------------------------------------
          # strings.xml
          # ------------------------------------------------------

          STRINGS_FILE="android/app/src/main/res/values/strings.xml"

          if [ ! -f "$STRINGS_FILE" ]; then
            echo "ERREUR : strings.xml introuvable."
            exit 1
          fi

          XML_NAME=$(printf '%s' "$APP_NAME" \
            | sed \
              -e 's/&/\&amp;/g' \
              -e 's/</\&lt;/g' \
              -e 's/>/\&gt;/g' \
              -e 's/"/\&quot;/g' \
              -e "s/'/\&apos;/g")

          XML_NAME=$(printf '%s' "$XML_NAME" \
            | sed 's/|/\\|/g')

          if grep -q 'name="app_name"' "$STRINGS_FILE"; then

            sed -i -E \
              "s|<string[[:space:]]+name=\"app_name\">.*</string>|<string name=\"app_name\">$XML_NAME</string>|" \
              "$STRINGS_FILE"

          else

            sed -i \
              "s|</resources>|  <string name=\"app_name\">$XML_NAME</string>\n</resources>|" \
              "$STRINGS_FILE"

          fi

          echo "Nom Android configuré : $APP_NAME"

          # ------------------------------------------------------
          # AndroidManifest.xml
          #
          # IMPORTANT :
          # Aucun package="..." ne doit être ajouté.
          # ------------------------------------------------------

          MANIFEST_FILE="android/app/src/main/AndroidManifest.xml"

          if [ ! -f "$MANIFEST_FILE" ]; then
            echo "ERREUR : AndroidManifest.xml introuvable."
            exit 1
          fi

          sed -i -E \
            's/[[:space:]]+package="[^"]*"//' \
            "$MANIFEST_FILE"

          echo "AndroidManifest.xml vérifié."

      # ==========================================================
      # 11. VÉRIFIER LA CONFIGURATION
      # ==========================================================
      - name: Vérifier la configuration Android
        env:
          APP_NAME: ${{ steps.app_info.outputs.app_name }}
          APPLICATION_ID: ${{ steps.app_info.outputs.application_id }}
          APK_FILENAME: ${{ steps.app_info.outputs.apk_filename }}
        run: |
          echo "=========================================="
          echo "CONFIGURATION APK"
          echo "=========================================="
          echo "Nom            : $APP_NAME"
          echo "Application ID : $APPLICATION_ID"
          echo "Fichier APK    : $APK_FILENAME"
          echo "=========================================="

          echo ""
          echo "applicationId :"

          grep -n "applicationId" \
            android/app/build.gradle \
            2>/dev/null || true

          grep -n "applicationId" \
            android/app/build.gradle.kts \
            2>/dev/null || true

          echo ""
          echo "app_name :"

          grep -n "app_name" \
            android/app/src/main/res/values/strings.xml \
            || true

          echo ""
          echo "manifest :"

          grep -n "<manifest" \
            android/app/src/main/AndroidManifest.xml \
            || true

          echo ""
          echo "package= dans le manifeste :"

          if grep -q 'package="' \
            android/app/src/main/AndroidManifest.xml; then

            echo "ERREUR : package= est encore présent."
            exit 1

          else

            echo "OK : aucun package= dans AndroidManifest.xml."

          fi

          echo ""
          echo "ic_launcher :"

          ls -lh \
            android/app/src/main/res/mipmap-mdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png

          echo ""
          echo "ic_launcher_round :"

          ls -lh \
            android/app/src/main/res/mipmap-mdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-hdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-xhdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-xxhdpi/ic_launcher_round.png \
            android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png

          echo ""
          echo "Icône adaptative :"

          ls -lh \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml \
            android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

      # ==========================================================
      # 12. PRÉPARER GRADLE
      # ==========================================================
      - name: Préparer Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Rendre Gradle exécutable
        run: chmod +x android/gradlew

      # ==========================================================
      # 13. CONSTRUIRE L'APK
      # ==========================================================
      - name: Construire l'APK
        working-directory: android
        run: |
          ./gradlew assembleDebug --no-daemon

      # ==========================================================
      # 14. PRÉPARER LE FICHIER APK FINAL
      # ==========================================================
      - name: Préparer le fichier APK final
        env:
          APK_FILENAME: ${{ steps.app_info.outputs.apk_filename }}
        run: |
          mkdir -p generated-apk

          cp \
            android/app/build/outputs/apk/debug/app-debug.apk \
            "generated-apk/$APK_FILENAME"

          echo "APK final :"
          ls -lh generated-apk/

      # ==========================================================
      # 15. PUBLIER L'APK
      # ==========================================================
      - name: Publier l'APK
        uses: actions/upload-artifact@v6
        with:
          name: simirork-apk
          path: generated-apk/*.apk
          if-no-files-found: error